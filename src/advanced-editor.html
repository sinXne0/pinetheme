<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- This page is sandboxed from the studio shell: its own CSS only. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline' data:; script-src 'self' 'unsafe-eval'; connect-src 'none';">
  <title>Advanced Image Editor</title>
  <link rel="stylesheet" href="vendor/tui/tui-color-picker.min.css">
  <link rel="stylesheet" href="vendor/tui/tui-image-editor.min.css">
  <style>
    html, body { margin: 0; height: 100%; background: #101510; color: #cfe9dc; font: 12px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden; }
    #wrap { display: flex; flex-direction: column; height: 100%; }
    #note { padding: 5px 10px; background: #0a100d; border-bottom: 1px solid #24402f; color: #7fa08d; font-size: 11px; }
    #editor { flex: 1; min-height: 0; }
    .tui-image-editor-header { display: none !important; }
    .tui-image-editor-main-container { background: #1a1f1a; }
    .tui-image-editor-menu { background: #141a15; }
    .tui-image-editor-submenu { background: #141a15; }
    .tui-image-editor-help-menu { background: #141a15; }
    .tui-image-editor-wrap { background: #1a1f1a; }
    .tui-image-editor-checkbox label,
    .tui-image-editor-checkbox span,
    .tui-image-editor-range-value,
    .tui-image-editor-submenu-item label { color: #b9d2c1 !important; }
    .tui-image-editor-checkbox input:checked + label { color: #00ff9c !important; }
    .tui-image-editor-range-value { background: #0b100d !important; border-color: #3a5144 !important; }
    .tui-image-editor-submenu .tui-image-editor-submenu-item { color: #b9d2c1; }
  </style>
</head>
<body>
  <div id="wrap">
    <div id="note">Advanced editor · crop, draw, shapes, text, masks, filters. Click “Use result” in the studio bar to send it back to Image Lab.</div>
    <div id="editor"></div>
  </div>
  <script src="vendor/tui/tui-color-picker.min.js"></script>
  <script src="vendor/tui/tui-image-editor.min.js"></script>
  <script src="advanced-editor.js"></script>
</body>
</html>
